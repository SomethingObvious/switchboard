[project]
name = "switchboard"
version = "1.0.0"
description = "Animated pictures of LLM inference, drawn from real runs of small public models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Paul Wu" }]
dependencies = []

[project.optional-dependencies]
trace = ["torch>=2.6", "transformers>=5.0"]
export = ["switchboard[trace]", "onnx>=1.20", "onnxruntime>=1.25", "onnxscript>=0.5"]

[project.scripts]
switchboard = "switchboard.__main__:main"

[dependency-groups]
dev = ["mypy==2.4.1", "pytest>=8", "ruff==0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "PL", "ANN"]
ignore = ["PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "PLC0415", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["switchboard", "tests", "training"]
strict = true
# torch and the rest are untyped here (see below), so returning their values and subclassing
# torch.nn.Module would be flagged everywhere they're used.
warn_return_any = false
disallow_subclassing_any = false
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]

[[tool.mypy.overrides]]
# CI checks without the model extras (torch alone is a couple of GB), so these are skipped
# even where they're installed, or a local run would see types that CI doesn't.
module = ["torch.*", "transformers.*", "onnx.*", "onnxruntime.*", "onnxscript.*", "numpy.*", "huggingface_hub.*", "safetensors.*", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true
